<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><script>
Promise.all(['../data/facilities.json','../data/people_ranking.json'].map(u=>fetch(u).then(r=>r.json()))).then(([f,p])=>{
  var fr=document.createElement('iframe');fr.src='../index.html#sites';fr.style.cssText='width:1200px;height:700px';document.body.appendChild(fr);
  setTimeout(function(){var w=fr.contentWindow.APP.ws;var fn=new Set(f.map(x=>x.name)),sn=new Set(w.sites.map(x=>x.name));
    console.log('file facilities',f.length,'app',w.sites.length,'missing',f.filter(x=>!sn.has(x.name)).length,'extra',w.sites.filter(x=>!fn.has(x.name)).map(x=>x.name).join('|'));
    console.log('file people',p.length,'app',w.people.length,'names',w.people.map(x=>x.name).join(','));
    var bad=f.filter(x=>{var s=w.sites.find(y=>y.name===x.name);var l=s&&w.locations.find(q=>q.id===s.loc);return !l||l.name!==x.location||s.tag!==x.category});console.log('loc/category mismatches',bad.length,bad.slice(0,3).map(x=>x.name).join('|'));
  },6000);
});
</script></body></html>
