<!DOCTYPE html><html><head><meta charset="UTF-8"><title>goals demo</title></head><body>
<script src="../js/i18n.js"></script>
<script src="../js/core.js"></script>
<script>
var M=window.MV;
fetch('../data/complete_data.json').then(function(r){return r.json()}).then(function(o){
  var ws=M.fromDataset(o,'Goals demo');ws.scope={mode:'month',start:'2026-10-01',end:''};
  var ab=ws.people.find(function(p){return p.name==='أباظة'}),am=ws.people.find(function(p){return p.name==='أماني'});
  var tags=Array.from(new Set(M.plannable(ws).map(function(s){return s.tag}))).filter(Boolean);
  var site=M.plannable(ws).find(function(s){return s.cat==='c_contracted'});
  ws.goals=[
    M.mkGoal({who:{k:'person',v:[ab.id]},per:'person',what:{k:'cat',v:['c_contracted']},op:'min',n:3}),
    M.mkGoal({who:{k:'person',v:[ab.id,am.id]},mode:'together',k:2,per:'total',op:'max',n:0,hard:true}),
    M.mkGoal({what:{k:'tag',v:tags.slice(4,7)},per:'total',op:'between',n:4,n2:6}),
    M.mkGoal({what:{k:'cat',v:['c_contracted']},per:'total',period:'week',op:'min',n:1}),
    M.mkGoal({kind:'inject',what:{k:'site',v:[site.id]},inject:{mode:'dates',dates:'2026-10-14',n:1},who:{k:'person',v:[am.id]}}),
    M.mkGoal({kind:'inject',what:{k:'kmLe',v:'20'},when:{k:'dow',v:[false,false,false,false,true,false,false]},inject:{mode:'pick',n:2}})
  ];
  ws.engine.quality='fast';
  var ix=M.Store.index();ix.prefs=ix.prefs||{};ix.prefs.dsBooted=true;ix.prefs.lang=location.hash==='#ar'?'ar':'en';
  M.Store.save(ws,ix);
  location.replace('../index.html#plan');
});
</script></body></html>
